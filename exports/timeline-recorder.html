<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雲南十日行程時間軸錄製</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08121f; color: #e8f0f7; font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  main { width: min(1280px, 100vw); padding: 20px; }
  canvas { width: 100%; height: auto; display: block; border: 1px solid #294056; border-radius: 14px; box-shadow: 0 20px 60px #0008; background: #0d2132; }
  #status { margin-top: 12px; color: #9fb5c7; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<main>
<canvas id="map" width="1280" height="720" aria-label="雲南十日行程時間軸動畫"></canvas>
<div id="status">準備錄製…</div>
</main>
<script>
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
const W = canvas.width, H = canvas.height;

// Key stops from the supplied 2026-10-08 to 2026-10-17 itinerary.
const days = [
  {day:8, title:'飛向雲南', stops:[['台北 TPE',25.08,121.23,'12:30'],['廣州 CAN',23.39,113.30,'17:15'],['昆明 KMG',25.10,102.93,'21:30'],['昆明入住',25.04,102.71,'23:00']]},
  {day:9, title:'花市與洱海', stops:[['斗南花市',24.91,102.79,'08:40'],['昆明站',25.02,102.72,'10:30'],['大理古城',25.70,100.16,'14:40'],['洱海 S 灣',25.78,100.16,'16:00'],['喜洲古鎮',25.85,100.13,'17:15']]},
  {day:10, title:'繞著洱海走', stops:[['理想邦',25.71,100.28,'09:30'],['文筆村',25.77,100.27,'11:30'],['小普陀',25.85,100.24,'13:40'],['雙廊古鎮',25.94,100.19,'15:15']]},
  {day:11, title:'走進怒江山谷', stops:[['知子羅',26.55,98.91,'13:30'],['老姆登',26.56,98.90,'14:45'],['福貢',26.90,98.87,'18:00']]},
  {day:12, title:'越過山，抵達秘境', stops:[['人馬吊橋',26.94,98.86,'08:30'],['石月亮',27.11,98.86,'10:00'],['丙中洛',28.00,98.62,'13:00'],['獨龍江',27.88,98.34,'18:30']]},
  {day:13, title:'獨龍江的村落', stops:[['龍元村',27.85,98.33,'08:00'],['哈滂瀑布',27.77,98.33,'09:20'],['普卡旺',27.92,98.33,'11:00'],['怒江第一灣',27.97,98.62,'16:15'],['六庫',25.85,98.86,'22:30']]},
  {day:14, title:'古城慢時光', stops:[['麗江古城',26.87,100.23,'13:30'],['白沙古鎮',26.95,100.22,'15:00'],['文昌宮',26.88,100.23,'17:15']]},
  {day:15, title:'沿江向雪山', stops:[['長江第一灣',26.88,99.96,'09:00'],['上虎跳峽',27.18,100.11,'11:00'],['香格里拉',27.83,99.70,'14:00'],['飛來寺',28.44,98.87,'19:00']]},
  {day:16, title:'日照金山，再回昆明', stops:[['金沙江大拐彎',28.29,99.30,'09:30'],['白馬雪山',28.35,99.08,'11:00'],['普達措',27.83,99.96,'14:00'],['香格里拉站',27.81,99.68,'17:00'],['昆明',25.04,102.71,'23:45']]},
  {day:17, title:'帶著風景回家', stops:[['昆明 KMG',25.10,102.93,'05:30'],['廣州 CAN',23.39,113.30,'09:50'],['台北 TPE',25.08,121.23,'13:30']]}
];
const all = days.flatMap((d, di) => d.stops.map((s, si) => ({day:d.day,title:d.title,label:s[0],lat:s[1],lon:s[2],time:s[3],di,si}))); 
const minLat = 23.0, maxLat = 29.0, minLon = 97.5, maxLon = 122.5;
const map = {x:34,y:94,w:820,h:500};
const px = (lon) => map.x + (lon-minLon)/(maxLon-minLon)*map.w;
const py = (lat) => map.y + (maxLat-lat)/(maxLat-minLat)*map.h;
const start = Date.parse('2026-10-08T12:30:00+08:00');
const end = Date.parse('2026-10-17T14:00:00+08:00');
const total = end-start;
const totalFrames = 20*30;

function lerp(a,b,t){ return a+(b-a)*t; }
function stateAt(f){
  const q = f/(totalFrames-1);
  const ms = start + q*total;
  const dayIndex = Math.min(days.length-1, Math.floor(q*days.length));
  const dayStart = dayIndex/days.length, dayEnd=(dayIndex+1)/days.length;
  const local = Math.min(0.999999, Math.max(0,(q-dayStart)/(dayEnd-dayStart)));
  const d = days[dayIndex];
  const seg = Math.min(d.stops.length-1, Math.floor(local*d.stops.length));
  const a=d.stops[seg], b=d.stops[Math.min(d.stops.length-1,seg+1)];
  const t = seg===d.stops.length-1 ? 0 : (local*d.stops.length-seg);
  return {q,ms,dayIndex,d,a,b,t,lat:lerp(a[1],b[1],t),lon:lerp(a[2],b[2],t)};
}
function roundedRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}}
function text(txt,x,y,size,color,weight='400',align='left'){ctx.font=`${weight} ${size}px "Microsoft JhengHei", "Noto Sans TC", sans-serif`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(txt,x,y);}
function drawBackground(){
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#102a42');g.addColorStop(1,'#071522');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#ffffff0b';ctx.lineWidth=1;
  for(let x=map.x;x<=map.x+map.w;x+=58){ctx.beginPath();ctx.moveTo(x,map.y);ctx.lineTo(x,map.y+map.h);ctx.stroke();}
  for(let y=map.y;y<=map.y+map.h;y+=52){ctx.beginPath();ctx.moveTo(map.x,y);ctx.lineTo(map.x+map.w,y);ctx.stroke();}
  ctx.fillStyle='#1b4966aa';ctx.beginPath();ctx.ellipse(520,360,260,170,0,0,Math.PI*2);ctx.fill();
  text('雲南十日行程',34,44,29,'#f0f7ff','500');
  text('2026.10.08 — 2026.10.17  ·  示意位置與估算時間',34,70,15,'#9fb8cb');
  roundedRect(882,94,360,500,18,'#10283a','#29445a');
  text('CURRENT LOCATION',914,130,12,'#7ea4bc','500');
}
function routePointsUntil(frame){
  const current=stateAt(frame);const out=[];
  for(let i=0;i<all.length;i++){
    const p=all[i]; if(p.di<current.dayIndex || (p.di===current.dayIndex && p.si<=current.si)) out.push(p);
  }
  out.push({lat:current.lat,lon:current.lon}); return out;
}
function draw(frame){
  const s=stateAt(frame);drawBackground();
  const pts=routePointsUntil(frame);
  ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();
  pts.forEach((p,i)=>{const x=px(p.lon),y=py(p.lat);if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);});
  ctx.strokeStyle='#64d6c3';ctx.lineWidth=5;ctx.shadowColor='#64d6c380';ctx.shadowBlur=10;ctx.stroke();ctx.shadowBlur=0;
  all.forEach((p,i)=>{const x=px(p.lon),y=py(p.lat);const visited=p.di<s.dayIndex || (p.di===s.dayIndex&&p.si<=s.si);ctx.beginPath();ctx.arc(x,y,visited?5:3,0,Math.PI*2);ctx.fillStyle=visited?'#b9f7e9':'#54768a';ctx.fill();});
  const cx=px(s.lon),cy=py(s.lat);ctx.beginPath();ctx.arc(cx,cy,13+Math.sin(frame/5)*2,0,Math.PI*2);ctx.fillStyle='#f9c74f55';ctx.fill();ctx.beginPath();ctx.arc(cx,cy,7,0,Math.PI*2);ctx.fillStyle='#ffd166';ctx.fill();
  const cityLabels=[['昆明',25.04,102.71],['大理',25.70,100.16],['怒江',26.90,98.87],['麗江',26.87,100.23],['香格里拉',27.83,99.70],['梅里',28.44,98.87]];
  cityLabels.forEach(([n,lat,lon])=>{text(n,px(lon)+8,py(lat)-8,13,'#b6cad8','500');});
  text(`10/${String(s.day).padStart(2,'0')}  ${s.title}`,914,176,24,'#f4f8fb','500');
  text(`${s.a[3]}  ·  ${s.a[0]}`,914,214,19,'#7ee4d0','500');
  const lines=[`目前位於 ${s.a[0]}`,`下一站 ${s.b[0]}`,`行程日 ${s.day-7} / 10`];
  lines.forEach((t,i)=>text(t,914,262+i*32,17,'#c7d7e2'));
  roundedRect(914,374,295,74,12,'#0b1b2a','#244459');
  text('時間軸進度',934,401,12,'#7ea4bc');
  text(new Date(s.ms+8*3600000).toISOString().slice(0,16).replace('T','  '),934,430,19,'#f4f8fb','500');
  const tx=34,ty=640,tw=1208;ctx.strokeStyle='#315167';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+tw,ty);ctx.stroke();
  for(let i=0;i<10;i++){const x=tx+tw*(i/9);ctx.beginPath();ctx.arc(x,ty,5,0,Math.PI*2);ctx.fillStyle=i<=s.dayIndex?'#64d6c3':'#466176';ctx.fill();text(`10/${8+i}`,x,ty+31,12,'#9fb8cb','400','center');}
  ctx.beginPath();ctx.arc(tx+tw*s.q,ty,9,0,Math.PI*2);ctx.fillStyle='#ffd166';ctx.fill();
  text('路線為行程示意，景點座標與部分時間為估算',34,699,12,'#6f8da0');
}

async function record(){
  if(!canvas.captureStream || !window.MediaRecorder){status.textContent='此瀏覽器不支援錄製';return;}
  const stream=canvas.captureStream(30);let mime='video/webm;codecs=vp9';if(!MediaRecorder.isTypeSupported(mime))mime='video/webm;codecs=vp8';
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5_000_000});const chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=async()=>{const blob=new Blob(chunks,{type:mime});status.textContent=`錄製完成，正在保存（${(blob.size/1024/1024).toFixed(1)} MB）…`;const res=await fetch('/upload',{method:'POST',headers:{'Content-Type':mime},body:blob});if(res.ok){status.textContent='已完成：yunnan-journey-timeline-2026-10.webm';}else{status.textContent='保存失敗';}};
  let frame=0;rec.start(1000);
  const tick=()=>{draw(frame);status.textContent=`錄製中… ${Math.min(100,Math.round(frame/(totalFrames-1)*100))}%`;frame++;if(frame<totalFrames)requestAnimationFrame(tick);else setTimeout(()=>rec.stop(),300);};tick();
}
draw(0);setTimeout(record,500);
</script>
</body>
</html>
